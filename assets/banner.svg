<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Carlos Llano, desarrollador de software full stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080d"/>
      <stop offset="1" stop-color="#11142a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ff4fd8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="10s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1"><stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".35"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <style>
      .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,monospace}
      .rol{opacity:0;animation:ciclo 12s infinite}
      .r2{animation-delay:3s}.r3{animation-delay:6s}.r4{animation-delay:9s}
      @keyframes ciclo{0%{opacity:0;transform:translateY(8px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-8px)}}
      .cursor{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>
  <circle cx="160" cy="40" r="260" fill="url(#glow1)">
    <animate attributeName="cx" values="160;260;160" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="260" r="240" fill="url(#glow2)">
    <animate attributeName="cy" values="260;200;260" dur="12s" repeatCount="indefinite"/>
  </circle>
  <text x="70" y="128" class="t" font-size="64" font-weight="700" fill="url(#txt)">Carlos Llano</text>
  <text x="72" y="172" class="t" font-size="26" fill="#e8eaf2">Desarrollador de Software Full Stack</text>
  <g class="mono" font-size="22" fill="#22d3ee">
    <text x="72" y="228">&gt;</text>
    <text x="98" y="228" class="rol">Backend con .NET, Java y Django</text>
    <text x="98" y="228" class="rol r2">Apps móviles con Flutter</text>
    <text x="98" y="228" class="rol r3">Web con React y Astro</text>
    <text x="98" y="228" class="rol r4">Videojuegos con Godot y Unity</text>
  </g>
  <rect x="72" y="244" width="12" height="3" fill="#22d3ee" class="cursor"/>
  <g class="t" font-size="16" fill="#9aa0b4" text-anchor="end">
    <text x="1130" y="70">Arequipa, Perú</text>
    <text x="1130" y="96">TECSUP · Diseño y Desarrollo de Software</text>
  </g>
</svg>
